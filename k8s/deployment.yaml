apiVersion: apps/v1
kind: Deployment
metadata:
  name: vente-maison
  labels: {app: vente-maison}
spec:
  replicas: 2
  selector:
    matchLabels: {app: vente-maison}
  template:
    metadata:
      labels: {app: vente-maison}
    spec:
      containers:
        - name: web
          image: ghcr.io/marcdonald237/vente-articles-maison:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
